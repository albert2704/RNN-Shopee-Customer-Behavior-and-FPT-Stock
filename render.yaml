services:
  - type: web
    name: sequence-fpt-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./models/hosting/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    numInstances: 1
    autoDeployTrigger: off
    disk:
      name: fpt-runtime
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: A6_ENV
        value: production
      - key: FPT_DAILY_HOME
        value: /var/data/daily
      - key: A6_PUBLIC_DATA_DIR
        value: /var/data/public
      - key: A6_ALLOWED_ORIGINS
        sync: false
      - key: CHAT_DEMO_CODE
        generateValue: true
      - key: CHAT_DAILY_LIMIT
        value: "100"
      - key: CHAT_MINUTE_LIMIT
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
