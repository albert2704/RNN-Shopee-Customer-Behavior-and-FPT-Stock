services:
  - type: web
    name: sequence-fpt-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./models/hosting/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: A6_ENV
        value: production
      - key: FPT_DAILY_HOME
        value: /tmp/sequence/daily
      - key: A6_PUBLIC_DATA_DIR
        value: /tmp/sequence/public
      - key: A6_ALLOW_REFRESH
        value: "false"
      - key: FPT_PUBLISHED_UPDATES
        value: "true"
      - key: A6_ALLOWED_ORIGINS
        sync: false
      - key: CHAT_REQUIRE_ACCESS_CODE
        value: "false"
      - key: CHAT_ENFORCE_LIMITS
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
